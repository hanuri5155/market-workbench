name: Release (build -> push GHCR -> deploy OCI)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vars
        id: vars
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR (push)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Meta (api)
        id: meta_api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/market-workbench-api
          tags: |
            type=raw,value=${{ steps.vars.outputs.tag }}

      - name: Build & Push (api)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile.api
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_api.outputs.tags }}
          labels: ${{ steps.meta_api.outputs.labels }}

      - name: Meta (bot)
        id: meta_bot
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/market-workbench-bot
          tags: |
            type=raw,value=${{ steps.vars.outputs.tag }}

      - name: Build & Push (bot)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile.bot
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_bot.outputs.tags }}
          labels: ${{ steps.meta_bot.outputs.labels }}

  deploy:
    runs-on: [self-hosted, market-workbench-deploy]
    needs: build-and-push

    steps:
      - name: Deploy on self-hosted runner (compose pull & up)
        shell: bash
        env:
          TAG: ${{ needs.build-and-push.outputs.tag }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USER: ${{ secrets.GHCR_USER }}
          IMAGE_OWNER: ${{ github.repository_owner }}
          COMPOSE_DIR: ${{ vars.MARKET_WORKBENCH_COMPOSE_DIR || '/opt/market-workbench/compose' }}
        run: |
          set -euo pipefail

          cd "$COMPOSE_DIR"
          echo "[DEPLOY] tag=$TAG"
          echo "[DEPLOY] host=$(hostname)"

          if [ -z "${GHCR_PAT:-}" ] || [ -z "${GHCR_USER:-}" ]; then
            echo "[DEPLOY] GHCR_PAT/GHCR_USER is required for private GHCR images" >&2
            exit 1
          fi
          echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

          ENV_BACKUP=".env.bak-$(date +%Y%m%d-%H%M%S)-release-${TAG}"
          cp .env "$ENV_BACKUP"
          chmod --reference=.env "$ENV_BACKUP" || chmod 600 "$ENV_BACKUP"
          echo "[DEPLOY] env_backup=$ENV_BACKUP"

          API_IMAGE="ghcr.io/${IMAGE_OWNER}/market-workbench-api:${TAG}"
          BOT_IMAGE="ghcr.io/${IMAGE_OWNER}/market-workbench-bot:${TAG}"

          grep -q '^API_IMAGE=' .env \
            && sed -i "s|^API_IMAGE=.*|API_IMAGE=${API_IMAGE}|g" .env \
            || echo "API_IMAGE=${API_IMAGE}" >> .env

          grep -q '^BOT_IMAGE=' .env \
            && sed -i "s|^BOT_IMAGE=.*|BOT_IMAGE=${BOT_IMAGE}|g" .env \
            || echo "BOT_IMAGE=${BOT_IMAGE}" >> .env

          docker compose -p market-workbench --env-file .env -f compose.yaml config --quiet
          docker compose -p market-workbench --env-file .env -f compose.yaml pull api bot

          echo "[DEPLOY] restarting api only first"
          docker compose -p market-workbench --env-file .env -f compose.yaml up -d --no-deps api
          curl -fsS http://127.0.0.1:8000/healthz

          echo "[DEPLOY] restarting bot after api health check"
          docker compose -p market-workbench --env-file .env -f compose.yaml up -d --no-deps bot

          echo "[DEPLOY] infra services are intentionally outside this release job"
          docker compose -p market-workbench --env-file .env -f compose.yaml ps

  create-release:
    runs-on: ubuntu-latest
    needs: deploy
    if: needs.deploy.result == 'success'
    steps:
      - name: Create draft GitHub Release (auto notes)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true
